services:
  octoprint:
    container_name: octoprint
    image: octoprint/octoprint:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/ttyUSB0
    volumes:
      - ./octoprint:/octoprint
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.octoprint.entrypoints=https"
      - "traefik.http.routers.octoprint.rule=Host(`octoprint.corsair.tf`)"
      - "traefik.http.routers.octoprint.middlewares=private@file,security-soft@file"
      - "traefik.http.routers.octoprint.service=octoprint"
      - "traefik.http.services.octoprint.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  filebrowser:
    container_name: filebrowser
    image: gtstef/filebrowser:stable
    volumes:
      - /mnt/tank/users/max/filebrowser:/max # Do not use a root "/" directory or include the "/var" folder
      - ./filebrowser:/home/filebrowser/data
    user: "3000:3000"
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.entrypoints=https"
      - "traefik.http.routers.files.rule=Host(`files.corsair.tf`)"
      - "traefik.http.routers.files.middlewares=security@file,private@file"
      - "traefik.http.routers.files.service=files"
      - "traefik.http.services.files.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  homelable:
    container_name: homelable
    image: ghcr.io/pouzor/homelable-frontend:latest
    restart: unless-stopped
    depends_on:
      - homelable-backend
    networks:
      - traefik
      - homelable
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homelable.entrypoints=https"
      - "traefik.http.routers.homelable.rule=Host(`homelable.corsair.tf`)"
      - "traefik.http.routers.homelable.middlewares=security@file,private@file"
      - "traefik.http.routers.homelable.service=homelable"
      - "traefik.http.services.homelable.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  homelable-backend:
    container_name: homelable_backend
    image: ghcr.io/pouzor/homelable-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
      CORS_ORIGINS: '["https://homelable.corsair.tf"]'
    volumes:
      - ./homelable:/app/data
    networks:
      homelable:
        aliases:
          - backend
    cap_add:
      - NET_RAW

  homelable-mcp:
    container_name: homelable_mcp
    image: ghcr.io/pouzor/homelable-mcp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - homelable-backend
    networks:
      - traefik
      - homelable
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homelable-mcp.entrypoints=https"
      - "traefik.http.routers.homelable-mcp.rule=Host(`mcp.homelable.corsair.tf`)"
      - "traefik.http.routers.homelable-mcp.middlewares=security@file,private@file"
      - "traefik.http.routers.homelable-mcp.service=homelable-mcp"
      - "traefik.http.services.homelable-mcp.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik"

  trek:
    image: mauriceboe/trek:latest
    container_name: trek
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    env_file:
      - trek.env
    environment:
      - NODE_ENV=production
      - PORT=3000
#     - ENCRYPTION_KEY= # Recommended. Generate with: openssl rand -hex 32. If unset, falls back to data/.jwt_secret (existing installs) or auto-generates a key (fresh installs).
      - TZ=Europe/Paris # Timezone for logs, reminders and scheduled tasks (e.g. Europe/Berlin)
      - LOG_LEVEL=${LOG_LEVEL:-info} # info = concise user actions; debug = verbose admin-level details
#      - TREK_WIKI_DIR=/app/wiki # Where the in-app Help pages (/help) read their content from. Leave unset: the image ships the wiki at /app/wiki and finds it automatically. Only set this to serve your own docs, mounted into the container. If the path does not exist, Help falls back to fetching the public GitHub wiki (needs outbound network, and tracks the latest release rather than your version).
#      - DEFAULT_LANGUAGE=en # Default language on the login page for users with no saved preference. Browser/OS language is auto-detected first; this is the fallback. Supported: de, en, es, fr, hu, nl, br, cs, pl, ru, zh, zh-TW, it, ar
#      - SESSION_DURATION=30d # How long users stay logged in (trek_session JWT + cookie maxAge). Accepts: 1h | 12h | 7d | 30d | 90d. Default: 24h
#      - SESSION_DURATION_REMEMBER=30d # Session length when "Remember me" is ticked at login: longer-lived JWT + persistent cookie that survives browser restarts. Same format as SESSION_DURATION. Default: 30d
      - ALLOWED_ORIGINS=https://trips.mytravelproject.fr,https://travel.corsair.tf,https://maps.mytravelproject.fr #ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-} # Comma-separated origins for CORS and email notification links
      - FORCE_HTTPS=true # Optional. Enables HTTPS redirect, HSTS, CSP upgrade-insecure-requests, and secure cookies behind a TLS proxy
#      - HSTS_INCLUDE_SUBDOMAINS=false # When true: adds includeSubDomains to the HSTS header. Only effective when HSTS is active. Leave false if sibling subdomains still run over plain HTTP.
#      - COOKIE_SECURE=false # Escape hatch: force session cookies over plain HTTP even in production. Not recommended.
      - TRUST_PROXY=1 # Trusted proxy count for X-Forwarded-For / X-Forwarded-Proto. Required for FORCE_HTTPS to work.
      - ALLOW_INTERNAL_NETWORK=true # Set to true if Immich or other services are hosted on your local network (RFC-1918 IPs). Loopback and link-local addresses remain blocked regardless.
#      - HTTP_PROXY=${HTTP_PROXY:-} # Optional. Proxy URL for outbound HTTP requests (e.g. http://192.168.1.10:7890)
#      - HTTPS_PROXY=${HTTPS_PROXY:-} # Optional. Proxy URL for outbound HTTPS requests
#      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1} # Optional. Comma-separated hosts and domains that bypass the outbound proxy
      - APP_URL=https://trips.mytravelproject.fr # Public base URL — required when OIDC is enabled (must match the redirect URI registered with your IdP); also used as base URL for links in email notifications
      - OIDC_ISSUER=https://login.corsair.tf # OpenID Connect provider URL
      - OIDC_CLIENT_ID=1b98f43b-bdfe-4abc-83ed-ac9d1cc01cdf # OpenID Connect client ID
      - OIDC_CLIENT_SECRET=ta-8bA_fr071GL3BxNySPfXQLVqKZEZeCALTZyOaMQRQ4ONFiLB3Uu96ylYy0hIi # OpenID Connect client secret
      - OIDC_DISPLAY_NAME=CorsairAuth # Label shown on the SSO login button
      - OIDC_ONLY=true # Set true to force SSO-only mode: disables password login and registration, overrides Admin > Settings toggles, cannot be changed at runtime
      - OIDC_ADMIN_CLAIM=email # OIDC claim used to identify admin users
      - OIDC_ADMIN_VALUE=max@corsair.tf # Value of the OIDC claim that grants admin role
#      - OIDC_SCOPE=openid email profile # Fully overrides the default. Add extra scopes as needed (e.g. add groups if using OIDC_ADMIN_CLAIM)
#      - OIDC_DISCOVERY_URL= # Override the OIDC discovery endpoint for providers with non-standard paths (e.g. Authentik)
#      - ADMIN_EMAIL=admin@trek.local # Initial admin e-mail — only used on first boot when no users exist
#      - ADMIN_PASSWORD=changeme      # Initial admin password — only used on first boot when no users exist
#      - MCP_RATE_LIMIT=300 # Max MCP API requests per user per minute (default: 300)
#      - MCP_MAX_SESSION_PER_USER=20 # Max concurrent MCP sessions per user (default: 20)
#      - KITINERARY_EXTRACTOR_PATH= # Optional. Full path to kitinerary-extractor binary. Auto-detected from PATH and /usr/lib/*/libexec/kf6/ when unset.
#      - UNSPLASH_ACCESS_KEY= # Optional. Unsplash Access Key for trip-cover / place-image search. Without one, TREK uses Unsplash's unauthenticated endpoint, which some datacenter/VPS IPs are blocked from (#1449). Free key at unsplash.com/developers. Can also be set per-admin in Admin > Settings; the env var overrides that.
    volumes:
      - ./trek:/app/data
      - ./trek/uploads:/app/uploads
#      - ./storage-config.json:/app/data/storage-config.json:ro # optional seed-once storage provisioning (wiki: Admin-Storage)
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # existing router (unchanged) — travel.corsair.tf, DNS-01/OVH wildcard cert
      - "traefik.http.routers.trek.entrypoints=https"
      - "traefik.http.routers.trek.rule=Host(`travel.corsair.tf`)"
      - "traefik.http.routers.trek.middlewares=security-soft@file"
      - "traefik.http.routers.trek.service=trek"
      - "traefik.http.services.trek.loadbalancer.server.port=3000"
      # new router — mytravelproject.fr subdomains, HTTP-01 cert
      - "traefik.http.routers.trek-mytravelproject.entrypoints=https"
      - "traefik.http.routers.trek-mytravelproject.rule=Host(`maps.mytravelproject.fr`) || Host(`trips.mytravelproject.fr`)"
      - "traefik.http.routers.trek-mytravelproject.middlewares=security-soft@file"
      - "traefik.http.routers.trek-mytravelproject.service=trek"
      - "traefik.http.routers.trek-mytravelproject.tls.certresolver=acme-http"

networks:
  traefik:
    external: true
  homelable:
    external: true
