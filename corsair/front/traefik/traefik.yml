global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: "WARN"
  filePath: "/etc/traefik/logs/traefik.log"

accessLog:
  filePath: "/etc/traefik/logs/access.log"
  format: json  # JSON format for better CrowdSec parsing
  filters:
    statusCodes:
      - "200"
      - "300-302"
      - "400-404"
      - "429"
      - "500-511"
  fields:
    headers:
      names:
        User-Agent: keep
        X-Forwarded-For: keep
        X-Real-Ip: keep

providers:
  docker:
    endpoint: "tcp://docker-socket-ro:2375"
    watch: true
    exposedByDefault: false

  file:
    directory: "/etc/traefik/config"
    watch: true

entryPoints:
  http:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 3600s  # Traefik v3 defaults to 60s, too short for large Immich uploads
    http:
      aliasHeadersStrategy: delete
      tls:
        certResolver: acme

api:
  dashboard: true
  insecure: false  # Secure the dashboard

metrics:
  prometheus:
    buckets: [0.1, 0.3, 1.2, 5.0]
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    manualRouting: true

certificatesResolvers:
  acme:
    acme:
      email: "macksize@gmail.com"
      storage: "/etc/traefik/acme/acme.json"
      dnsChallenge:
        provider: ovh
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
  acme-http:       # new, HTTP-01, no DNS API needed
    acme:
      email: "macksize@gmail.com"
      storage: "/etc/traefik/acme/acme-http.json"   # separate file from the DNS-01 one
      httpChallenge:
        entryPoint: http

# Experimental plugins
experimental:
  plugins:
    # CrowdSec Bouncer Plugin
    crowdsec-bouncer:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.8.1"
    # GeoBlock Plugin
    geoblock:
      moduleName: "github.com/PascalMinder/geoblock"
      version: "v0.3.8"
