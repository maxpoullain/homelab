                        - ENC[AES256_GCM,data:ZRGsq+BGe8SWV/LnEQ==,iv:oD/iIRVP0ye7bf5Oy/KaoVUVx5BzzLaUeqs1QdbwYGU=,tag:Tc1SLGqvu12HsVQGJyCvCg==,type:str]
                        - ENC[AES256_GCM,data:ReNzNxRJKV0kXQ==,iv:XV6x0NrWqbDSSyUUTvuICOLRELp7vHb7Y89SlWICvwk=,tag:4W4yD1QX7X6MEV560CLBwA==,type:comment]
                        - ENC[AES256_GCM,data:/XFm3x7bKDarflTd,iv:KFc0YE3s0YiJXmhyk9a2LpjoxBKnz5u3wOcXIbDuOL8=,tag:+vJya6JDcDt+4UJtBiTh5w==,type:str]
        # Rate limiting
        rate-limit:
            rateLimit:
                average: 100
                period: 1m
                burst: 50
        # Rate limiting = Permissive (for dashboards like Dashy, Home Assistant)
        rate-limit-soft:
            rateLimit:
                average: 1000
                period: 5m
                burst: 500
        # Geographic blocking - Allowlist Mode
        # Only the listed countries are allowed (blackListMode: false)
        geoblock:
            plugin:
                geoblock:
                    silentStartUp: false
                    allowLocalRequests: true
                    logLocalRequests: false
                    logAllowedRequests: false
                    logApiRequests: false
                    api: https://get.geojs.io/v1/ip/country/{ip}
                    apiTimeoutMs: 750
                    cacheSize: 10000
                    ignoreAPITimeout: true
                    ignoreAPIFailures: true
                    forceMonthlyUpdate: true
                    allowUnknownCountries: false
                    unknownCountryApiResponse: nil
                    blackListMode: false
                    allowedIPAddresses:
                        # Tailscale CGNAT range
                        - 100.64.0.0/10
                    countries:
                        # FRANCE
                        - FR
        # Security headers - Strict (for normal services)
        security-headers:
            headers:
                frameDeny: true
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:enj56sro5lgVzw==,iv:XEPntIC9Il0PZnVEgKQCa1j28ARDnwzzrRpMGmaYRPw=,tag:qkF29uKFEAgnravrKweHOw==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:FnxKlXZJRya11TyYmpvR9ZQA+gVY9e8/TbqDP4xDVWziKnluidO4jvd3ZE9iPWRglg==,iv:Et0/Y+K8HVxlWtGiIMpA9hnMPg/LetpI4m85tLtVn20=,tag:Ah7pCEJ3CCQULReGSlEPAA==,type:str]
                    server: ""
                    X-Powered-By: ""
        # Security headers - Permissive (for dashboards like Dashy, Home Assistant)
        # Allows framing and embedding
        security-headers-soft:
            headers:
                frameDeny: false
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:vHYxi3tNVA0=,iv:EFxBngKkYJ4K/mKAqIBJsOXU1RQxV7y2s/iQsyNVjUc=,tag:2jalAZ9YO3ITs1tmyyF4rA==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:DjwqRXMfVccW+Iz7XEulYA9dLPyCkhZBsnkoeY9D5XmPq7Z/cC3VsBLbycix4Pg3Hw==,iv:B4WgJa5NuvsMMsFLQ30PkDSJryjkaFuMlJDdELS4bfw=,tag:OTpEJA0E1+90uxXZPeAtpQ==,type:str]
                    server: ""
                    X-Powered-By: ""
                    #ENC[AES256_GCM,data:yjIHjBCQ4OWvMD9fqHU2jwj4v+cWFh66,iv:IR0yW74HL/4P05jO+tG++46YgGRetD6HTKtMzqtNW0I=,tag:shxynRPNOotLLLFM/kS7Fg==,type:comment]
                    X-Frame-Options: ENC[AES256_GCM,data:/VNGLMpU3mPh,iv:LcxCEVFgXvhkpW2wvHrHtFgchYSYouMHMKH9pQLMfFs=,tag:AaP1QeROeWKhUo7gSLTicg==,type:str]
                    Access-Control-Allow-Origin: ENC[AES256_GCM,data:9Q==,iv:MpZ+fwzAOvGiSOKri1a4IqhvUXMM4SHdxOU8dzc2yug=,tag:tdatMvWE/NRMNT0bEWZrtA==,type:str]
        # Compression
        compression:
            compress: {}
        # Tailscale + Local network whitelist
        private:
            IPAllowList:
                sourceRange:
                    # Tailscale CGNAT range
                    - 100.64.0.0/10
                    # Private networks (192.168.x.x)
                    - 192.168.0.0/16
                    # Private networks (10.x.x.x)
                    - 10.0.0.0/8
                    # Private networks (172.16-31.x.x)
                    - 172.16.0.0/12
                    # Localhost
                    - 127.0.0.1/32
                ipStrategy:
                    # Use direct client IP, not X-Forwarded-For
                    depth: 0
                    excludedIPs: []
        # Standard security chain
        security:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit
                    - security-headers
                    - compression
                    - crowdsec
        # Standard security chain
        security-soft:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit-soft
                    - security-headers-soft
                    - compression
                    - crowdsec
        security-private:
            chain:
                middlewares:
                    - private
                    - security-headers
                    - compression
        security-private-soft:
            chain:
                middlewares:
                    - private
                    - security-headers-soft
                    - compression
