                        - ENC[AES256_GCM,data:LcmZNP3fD1M/cg==,iv:+sDhEJR8C4czq1FQymx67mR+wqU+zD0LBpPa6dh90V0=,tag:GLlM2ueS3HSpISXMLKo0BQ==,type:comment]
                        - ENC[AES256_GCM,data:SiXklRzgzhm0McHF,iv:AuaAumgDxTauqMOoZaJxaphUbu81I2ulxmbVU4SAuDY=,tag:UMK71ziEQCbPIOcfjoWm9A==,type:str]
        # Rate limiting
        rate-limit:
            rateLimit:
                average: 100
                period: 1m
                burst: 50
        # Rate limiting = Permissive (for dashboards like Dashy, Home Assistant)
        rate-limit-soft:
            rateLimit:
                average: 1000
                period: 5m
                burst: 500
        # Geographic blocking - Blacklist Mode
        # Blocks only high-risk countries known for attacks
        geoblock:
            plugin:
                geoblock:
                    silentStartUp: false
                    allowLocalRequests: true
                    logLocalRequests: false
                    logAllowedRequests: false
                    logApiRequests: false
                    api: https://get.geojs.io/v1/ip/country/{ip}
                    apiTimeoutMs: 500
                    cacheSize: 15
                    forceMonthlyUpdate: true
                    allowUnknownCountries: false
                    unknownCountryApiResponse: nil
                    blackListMode: false
                    allowedIPAddresses:
                        # Tailscale CGNAT range
                        - 100.64.0.0/10
                    countries:
                        # FRANCE
                        - FR
        # Security headers - Strict (for normal services)
        security-headers:
            headers:
                frameDeny: true
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:pUQBOxElpre4tg==,iv:1xMs7XcwOuWTYYDK7hHh0I9rix7ag9e6KPYpE58ET+I=,tag:nf75PI9kOtnlpHss8BpBbg==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:SaYuauXn3GNOur74QRT6fs1xAIr9pqEfdSsmhjTVSe4YSmMu4LDGJNTt1zh1vC5GDQ==,iv:4J4hYHeQCamkvqiAkFqbUVoR60yQYHvyD7pIxcAxjYA=,tag:4+1Ee2X9vV/eaYZFDQ+axg==,type:str]
                    server: ""
                    X-Powered-By: ""
        # Security headers - Permissive (for dashboards like Dashy, Home Assistant)
        # Allows framing and embedding
        security-headers-soft:
            headers:
                frameDeny: false
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:1QkRq/NilJ0=,iv:iAJdgw2FXNuXpdXHnf5YclyUbtmsrl61edNrOl+A8/Q=,tag:Ncr0rw+olfrorZSouj6PZg==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:DXfzCSDt6ZGARAGlNUvf8vKCoGKCq+BGTA8hsMvZQ7fsuXR+hGZNilyrTrGC3LDLrA==,iv:1DdPvaFjYnK1rFSf7nAeZR3OJRlkIveMT7Rm18uPbjs=,tag:217vbc4J/RsFy1I4sllUvg==,type:str]
                    server: ""
                    X-Powered-By: ""
                    #ENC[AES256_GCM,data:NtmeuyZ4KMgR8dV8WDOm+WWNkvDkv6nE,iv:4ZYh1qAxmTyxEodQya03vwp3KtoIS61uoJvDa5zVQMc=,tag:AXZsTmH60B1/+baxDDp75w==,type:comment]
                    X-Frame-Options: ENC[AES256_GCM,data:e1UxmkKDloC5,iv:bTUJEVcYIIfxzBbmQlLwxs23jtsFZ8CMCVRl9CfatKg=,tag:cNF9B9FjHI7kjvvE4hbweg==,type:str]
                    Access-Control-Allow-Origin: ENC[AES256_GCM,data:Xg==,iv:1sBRz4oYG4Ew/gvB3GQKjgwo0NbC9G4phu+00metfdE=,tag:jHBA+wpdqjxEcKKU+WcH9A==,type:str]
        # Compression
        compression:
            compress: {}
        # Tailscale + Local network whitelist
        private:
            IPAllowList:
                sourceRange:
                    # Tailscale CGNAT range
                    - 100.64.0.0/10
                    # Private networks (192.168.x.x)
                    - 192.168.0.0/16
                    # Private networks (10.x.x.x)
                    - 10.0.0.0/8
                    # Private networks (172.16-31.x.x)
                    - 172.16.0.0/12
                    # Localhost
                    - 127.0.0.1/32
                ipStrategy:
                    # Use direct client IP, not X-Forwarded-For
                    depth: 0
                    excludedIPs: []
        # Standard security chain
        security:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit
                    - security-headers
                    - compression
                    - crowdsec
        # Standard security chain
        security-soft:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit-soft
                    - security-headers-soft
                    - compression
                    - crowdsec
