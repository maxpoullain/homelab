    middlewares:
        # CrowdSec Plugin Middleware
        crowdsec:
            plugin:
                crowdsec-bouncer:
                    enabled: true
                    logLevel: INFO
                    updateIntervalSeconds: 60
                    defaultDecisionSeconds: 60
                    httpTimeoutSeconds: 10
                    crowdsecMode: live
                    updateMaxFailure: -1
                    crowdsecAppsecEnabled: true
                    crowdsecAppsecUnreachableBlock: false
                    crowdsecAppsecFailureBlock: false
                    crowdsecAppsecHost: crowdsec:7422
                    crowdsecLapiKey: ENC[AES256_GCM,data:3hMdFGIJPu5OnrT4McF7c3i3KsAViAKOWfX0XqlKoim1NcuiOdCMjTNWoA==,iv:ApM4xfODLnzePc61Hw2SHLWkAwAPPWghkTY9QioxDcY=,tag:izfp6XyxXcc2o5gA09NgTw==,type:str]
