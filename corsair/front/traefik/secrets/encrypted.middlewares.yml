                    clientTrustedIPs:
                        - ENC[AES256_GCM,data:vqUXvky1Vy078T0BVBNmEjPM8LZ1ag==,iv:vqvQLENdoGbkcJJdIy76BZBDBUDv9UDuQ60BfTOunRw=,tag:Db2KEynLVRkyj4Q0dOAwYg==,type:comment]
