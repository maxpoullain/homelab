                        - ENC[AES256_GCM,data:VgFoJwAkmVFJRg==,iv:BAiqV6fMjzgNVcw92UKy60Mf31WEcJy8L0mGBgkdIAs=,tag:XVYBHdhUYmFKRe/afC79FQ==,type:comment]
                        - ENC[AES256_GCM,data:4ujt3DixXEJsNwrh,iv:5ButQIr04/Fu8tO2fHBgA6XWnDtBO3r9uAXsBBHDomw=,tag:0ppLNxEy62E87OxuY0n0yg==,type:str]
        # Rate limiting
        rate-limit:
            rateLimit:
                average: 100
                period: 1m
                burst: 50
        # Rate limiting = Permissive (for dashboards like Dashy, Home Assistant)
        rate-limit-soft:
            rateLimit:
                average: 1000
                period: 5m
                burst: 500
        # Geographic blocking - Allowlist Mode
        # Only the listed countries are allowed (blackListMode: false)
        geoblock:
            plugin:
                geoblock:
                    silentStartUp: false
                    allowLocalRequests: true
                    logLocalRequests: false
                    logAllowedRequests: false
                    logApiRequests: false
                    api: https://get.geojs.io/v1/ip/country/{ip}
                    apiTimeoutMs: 750
                    cacheSize: 10000
                    ignoreAPITimeout: true
                    ignoreAPIFailures: true
                    forceMonthlyUpdate: true
                    allowUnknownCountries: false
                    unknownCountryApiResponse: nil
                    blackListMode: false
                    allowedIPAddresses:
                        # Tailscale CGNAT range
                        - 100.64.0.0/10
                    countries:
                        # FRANCE
                        - FR
        # Security headers - Strict (for normal services)
        security-headers:
            headers:
                frameDeny: true
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:RTwDpPf3w0MQSg==,iv:06xeCMw0BaDxT1OjuiMs8oqIFUnvybX/wzGtOmQqyZk=,tag:VLtuG1H8ZIEgZ+m4wKz1pw==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:UxsH48WqtjKVmvQAHzIIt2cUTeOpFPQFRVZF4aaBHrQWttRXEzVN20QC/9tqORtskw==,iv:LOYQcjzBv9/t70KFpJoEYcfuRG0EUgV3PQlzyfJteCQ=,tag:CKeuVaGcOVksaLMlra2E+w==,type:str]
                    server: ""
                    X-Powered-By: ""
        # Security headers - Permissive (for dashboards like Dashy, Home Assistant)
        # Allows framing and embedding
        security-headers-soft:
            headers:
                frameDeny: false
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:gIw/lKiBACM=,iv:0wuFxIKRkS6eE5QkOgXP2ms1EPOSUz8y7iPQys0ZRb4=,tag:hpCTKs40Q1SjzYv68XHQdA==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:5ckuJARtYBDcWDT5HSf081ILCPMfYCYJKaUWMsT/Un+pH7/jsh60Is6It7MHSlQigg==,iv:qZWIMcRVRsajH/OjovpHPhC7JaKYLNQ5/oTiO0xMBYA=,tag:78EChEbjFxlQPnOOQA9FyQ==,type:str]
                    server: ""
                    X-Powered-By: ""
                    #ENC[AES256_GCM,data:aBKs+0OVljn0JARo9vNFUJhutNl8CG9a,iv:Y+JTBcSX2cEZSZ/1qj3xDmWhlSAIW40iQry6PV9xjmQ=,tag:BdslEdNb39yLd5kkYOA9tw==,type:comment]
                    X-Frame-Options: ENC[AES256_GCM,data:YxqA71/tTzPU,iv:IgVXBBm+jKJzGqj9gal27fbAklrp2BMQs4KZYTWVgik=,tag:XjqcigUpqrl2ci+LZGyBwg==,type:str]
                    Access-Control-Allow-Origin: ENC[AES256_GCM,data:3w==,iv:5S4AX0+1jzxRUvK4HdERJk6DwQy2wfqpSKE240phC3I=,tag:hHzknG+2GFqvmjTiUuuXBg==,type:str]
        # Compression
        compression:
            compress: {}
        # Tailscale + Local network whitelist
        private:
            IPAllowList:
                sourceRange:
                    # Tailscale CGNAT range
                    - 100.64.0.0/10
                    # Private networks (192.168.x.x)
                    - 192.168.0.0/16
                    # Private networks (10.x.x.x)
                    - 10.0.0.0/8
                    # Private networks (172.16-31.x.x)
                    - 172.16.0.0/12
                    # Localhost
                    - 127.0.0.1/32
                ipStrategy:
                    # Use direct client IP, not X-Forwarded-For
                    depth: 0
                    excludedIPs: []
        # Standard security chain
        security:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit
                    - security-headers
                    - compression
                    - crowdsec
        # Standard security chain
        security-soft:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit-soft
                    - security-headers-soft
                    - compression
                    - crowdsec
        # Private-only chain (no geoblock/crowdsec/rate-limit: already private-IP gated)
        private-chain:
            chain:
                middlewares:
                    - private
                    - security-headers
                    - compression
