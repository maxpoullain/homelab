                        - ENC[AES256_GCM,data:JEdDJUE+73cz2OLLZQ==,iv:uSvpEzdPr4nWMEZ2ICLsmee9P8KGphZ8Sw5JbzL+YFs=,tag:s235kxy3cDEcwSi8pn5a+Q==,type:str]
                        - ENC[AES256_GCM,data:xQDMMu4UPC9BYQ==,iv:vRm2RJ0+sOM6UvhoOrY57qEiLGfIW1BM2yklLUWqjzk=,tag:2RdHFjidC0wsoV3h70xdrA==,type:comment]
                        - ENC[AES256_GCM,data:hLGk0V8fzOBMjdxd,iv:lT3f3d+zUIImMTdPy62ubYs4+tQUpmZD/yW9AABrhXY=,tag:Fa3pYgFqhjQjdFLZUTC/1A==,type:str]
        # Rate limiting
        rate-limit:
            rateLimit:
                average: 100
                period: 1m
                burst: 50
        # Rate limiting = Permissive (for dashboards like Dashy, Home Assistant)
        rate-limit-soft:
            rateLimit:
                average: 1000
                period: 5m
                burst: 500
        # Geographic blocking - Allowlist Mode
        # Only the listed countries are allowed (blackListMode: false)
        geoblock:
            plugin:
                geoblock:
                    silentStartUp: false
                    allowLocalRequests: true
                    logLocalRequests: false
                    logAllowedRequests: false
                    logApiRequests: false
                    api: https://get.geojs.io/v1/ip/country/{ip}
                    apiTimeoutMs: 750
                    cacheSize: 10000
                    ignoreAPITimeout: true
                    ignoreAPIFailures: true
                    forceMonthlyUpdate: true
                    allowUnknownCountries: false
                    unknownCountryApiResponse: nil
                    blackListMode: false
                    allowedIPAddresses:
                        # Tailscale CGNAT range
                        - 100.64.0.0/10
                    countries:
                        # FRANCE
                        - FR
        # Security headers - Strict (for normal services)
        security-headers:
            headers:
                frameDeny: true
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:tGbys8LYoJBS2Q==,iv:rTlU1xO+d0tTnR4iIdyTD6cff0RrbNF1S5uMeXOWg9M=,tag:YjanyPDr3lscbI4UflDjtg==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:WJRTxQgl/VKa4yyTEz1Q4WNAOCDlNE0t2qWdwruoX/JYDDFJUmXFD0SOsq7ebreRCA==,iv:c4ZkFrq+Sq0flsOJhBJbaxtkCyrtwvhMKbWcJq5YQk0=,tag:LNJx2c/+ElOysMvuct2SAg==,type:str]
                    server: ""
                    X-Powered-By: ""
        # Security headers - Permissive (for dashboards like Dashy, Home Assistant)
        # Allows framing and embedding
        security-headers-soft:
            headers:
                frameDeny: false
                browserXssFilter: true
                contentTypeNosniff: true
                forceSTSHeader: true
                stsIncludeSubdomains: true
                stsPreload: true
                stsSeconds: 31536000
                customFrameOptionsValue: ENC[AES256_GCM,data:qerzC3mPlwA=,iv:ZuTayHjacubZuzmlVQyOmk6MdpwjQ7bJbyfuzc5VvuI=,tag:vNSl4Wdkp0P8GMdJ48YRtg==,type:str]
                customResponseHeaders:
                    X-Robots-Tag: ENC[AES256_GCM,data:cZwefLGyd9iHa+xN/9U+Ri3m54PZCiY2FePrvqNjIi8yWs7N0w8mr6rQruTQ40EWtg==,iv:F34iVAVyH4p7ei1GcIaIPy0/zRoWWBDS2+7+7G09AIk=,tag:hyq701egtiGR0SJ/HEIi/Q==,type:str]
                    server: ""
                    X-Powered-By: ""
                    #ENC[AES256_GCM,data:HgN/B+MfXVnlis94blvWhsdm+Y9rGLzQ,iv:zKr/PLeqeGiJT1yQTTaheka7siWcArGcqUsR0dJOHQA=,tag:nyfjTC1zzDdVZ8YP6/aXTA==,type:comment]
                    X-Frame-Options: ENC[AES256_GCM,data:SCizgCDJb9el,iv:rbFg5rGR7+YBtaoHTcduxfRXUMyaMQQBnOcYKsdy2F4=,tag:x9yaReMQGkrcmFJoY11ttg==,type:str]
                    Access-Control-Allow-Origin: ENC[AES256_GCM,data:qA==,iv:jR5Ak3V4EF9OmS6F7c2mrW9c0ZZXl61sHhchS5nJrPo=,tag:9/VgGcyBxvcAvFt30oB71w==,type:str]
        # Compression
        compression:
            compress: {}
        # Tailscale + Local network whitelist
        private:
            IPAllowList:
                sourceRange:
                    # Tailscale CGNAT range
                    - 100.64.0.0/10
                    # Private networks (192.168.x.x)
                    - 192.168.0.0/16
                    # Private networks (10.x.x.x)
                    - 10.0.0.0/8
                    # Private networks (172.16-31.x.x)
                    - 172.16.0.0/12
                    # Localhost
                    - 127.0.0.1/32
                ipStrategy:
                    # Use direct client IP, not X-Forwarded-For
                    depth: 0
                    excludedIPs: []
        # Standard security chain
        security:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit
                    - security-headers
                    - compression
                    - crowdsec
        # Standard security chain
        security-soft:
            chain:
                middlewares:
                    - geoblock
                    - rate-limit-soft
                    - security-headers-soft
                    - compression
                    - crowdsec
        security-private:
            chain:
                middlewares:
                    - private
                    - security-headers
                    - compression
        security-private-soft:
            chain:
                middlewares:
                    - private
                    - security-headers-soft
                    - compression
