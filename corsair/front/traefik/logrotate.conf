# Rotates Traefik logs using the host's logrotate (TrueNAS cron job).
# Run: logrotate -s /mnt/fast/apps/homelab/corsair/front/traefik/logs/logrotate.status /mnt/fast/apps/homelab/corsair/front/traefik/logrotate.conf
# copytruncate: Traefik keeps its file handle and CrowdSec keeps tailing the same file.
/mnt/fast/apps/homelab/corsair/front/traefik/logs/access.log /mnt/fast/apps/homelab/corsair/front/traefik/logs/traefik.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
    copytruncate
}
