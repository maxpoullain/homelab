services:
  # Read-only Docker API for Traefik / CrowdSec / tinyauth (instead of mounting docker.sock in each).
  # Only GET endpoints for containers, events, info, networks. No POST/exec/delete.
  docker-socket-ro:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-socket-ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - ALLOW_LOGS=1 # CrowdSec docker acquisition reads container logs
      - EVENTS=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  traefik:
    container_name: traefik
    image: traefik:v3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    networks:
      - traefik
      - socket
    env_file:
      - traefik.env
    volumes:
      - ./traefik:/etc/traefik/
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=https
      - traefik.http.routers.traefik.rule=(Host(`traefik.corsair.tf`) && !Path(`/metrics`))
      - traefik.http.routers.traefik.tls.domains[0].main=corsair.tf
      - traefik.http.routers.traefik.tls.domains[0].sans=*.corsair.tf
      - traefik.http.routers.traefik.middlewares=security-private@file,auth@docker
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik-metrics.entrypoints=https
      - traefik.http.routers.traefik-metrics.rule=(Host(`traefik.corsair.tf`) && Path(`/metrics`))
      - traefik.http.routers.traefik-metrics.middlewares=security-private@file,auth@docker
      - traefik.http.routers.traefik-metrics.service=prometheus@internal

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/linux crowdsecurity/home-assistant Dominic-Wagner/vaultwarden LePresidente/jellyfin gauth-fr/immich crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - GID=3002
      - UID=3000
      - CUSTOM_HOSTNAME=crowdsec
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./traefik/logs:/var/log/traefik:ro
    networks:
      - traefik
      - socket

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    container_name: tinyauth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - socket
    env_file:
      - tinyauth.env
    environment:
      - TINYAUTH_UI_BACKGROUNDIMAGE=/resources/background.jpg
      - TINYAUTH_AUTH_SESSIONEXPIRY=172800
      - DOCKER_HOST=tcp://docker-socket-ro:2375
    volumes:
      - ./tinyauth:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.entrypoints=https
      - traefik.http.routers.auth.rule=Host(`login.corsair.tf`)
      - traefik.http.routers.auth.service=auth
      - traefik.http.routers.auth.middlewares=security@file
      - traefik.http.services.auth.loadbalancer.server.port=3000
      - traefik.http.middlewares.auth.forwardauth.address=http://tinyauth:3000/api/auth/traefik
      - traefik.http.middlewares.auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.auth.forwardauth.maxResponseBodySize=1048576
      # ACLs
      - tinyauth.apps.traefik.config.domain=traefik.corsair.tf
      - tinyauth.apps.traefik.users.allow=max
      - tinyauth.apps.seedbox.config.domain=seedbox.corsair.tf
      - tinyauth.apps.seedbox.users.allow=max
      - tinyauth.apps.prowlarr.config.domain=prowlarr.corsair.tf
      - tinyauth.apps.prowlarr.users.allow=max
      - tinyauth.apps.shows.config.domain=shows.corsair.tf
      - tinyauth.apps.shows.users.allow=max
      - tinyauth.apps.movies.config.domain=movies.corsair.tf
      - tinyauth.apps.movies.users.allow=max

networks:
  traefik:
    external: true
  socket:
    internal: true # no internet, only reachable by services that join it
