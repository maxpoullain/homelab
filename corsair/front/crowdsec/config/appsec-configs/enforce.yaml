# AppSec ENFORCING: inband rule matches are blocked (HTTP 403) and the
# appsec-* scenarios (no longer in simulation.yaml) ban the source IP via profiles.yaml.
# Rollback: default_remediation: allow + re-add the appsec-* entries to simulation.yaml.
name: enforce
default_remediation: ban
inband_rules:
 - crowdsecurity/base-config
 - crowdsecurity/vpatch-*
 - crowdsecurity/generic-*
outofband_rules:
 - crowdsecurity/experimental-*
