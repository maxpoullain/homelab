services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - 7seas
    volumes:
      - ./gluetun:/gluetun
    env_file:
      - ./gluetun/.env
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=Switzerland
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      # Runs on every connection: MAM dynamic seedbox + Transmission peer port.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/gluetun/post-up.sh {{PORT}}'
    labels:
      - "com.getarcaneapp.arcane.updater=false"

  transmission:
    container_name: transmission
    image: linuxserver/transmission:4.1.3
    restart: unless-stopped
    cpus: 4
    mem_limit: 2048m
    security_opt:
      - no-new-privileges:true
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - "./transmission:/config"
      - "./transmission/watch:/watch"
      - "./gluetun/port:/port:ro"
      - "./gluetun/transmission-init:/custom-cont-init.d:ro"
      - "/mnt/fast/downloads/seedbox:/downloads"
      - "/mnt/tank/media/downloads:/tank/downloads"
      - "/mnt/tank/media/tv/:/tank/tv"
      - "/mnt/tank/media/movies/:/tank/movies"
      - "/mnt/tank/media/books/raw:/tank/books"
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris

  flood:
    container_name: flood
    image: jesec/flood:4.16.4
    restart: unless-stopped
    user: "3000:3002"
    cpus: 0.5
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - 7seas
    depends_on:
      transmission:
        condition: service_started
    volumes:
      - "./flood:/flood"
      - "/mnt/fast/downloads/seedbox:/downloads"
    command: --auth none --port 3000 --rundir /flood --trurl http://gluetun:9091/transmission/rpc --truser= --trpass= --allowedpath /downloads
    environment:
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.seedbox.entrypoints=https"
      - "traefik.http.routers.seedbox.rule=Host(`seedbox.corsair.tf`)"
      - "traefik.http.routers.seedbox.middlewares=security-private@file,auth@docker"
      - "traefik.http.routers.seedbox.service=seedbox"
      - "traefik.http.services.seedbox.loadbalancer.server.port=3000"
      - "com.getarcaneapp.arcane.updater=false"

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    cpus: 4
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - 7seas
    tmpfs:
      - /tmp:exec,size=256M
    environment:
      - PGID=3002
      - PUID=3000
      - TZ=Europe/Paris
      - LOG_LEVEL=info
      - LANG=fr_FR
      - BROWSER_TIMEOUT=240
      - NO_SANDBOX=True

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - 7seas
    depends_on:
      flaresolverr:
        condition: service_started
    volumes:
      - "./prowlarr:/config"
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Main router for / (with auth)
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.corsair.tf`)"
      - "traefik.http.routers.prowlarr.middlewares=security-private@file,auth@docker"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      # API router for /api (without auth)
      - "traefik.http.routers.prowlarr-api.entrypoints=https"
      - "traefik.http.routers.prowlarr-api.rule=Host(`prowlarr.corsair.tf`) && PathPrefix(`/api`)"
      - "traefik.http.routers.prowlarr-api.middlewares=security-private@file"
      - "traefik.http.routers.prowlarr-api.service=prowlarr"
      - "traefik.http.routers.prowlarr-api.priority=100"
      # Service definition
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    cpus: 1
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - 7seas
    depends_on:
      - prowlarr
    volumes:
      - "./sonarr:/config"
      - "/mnt/tank/media/tv/:/tv"
      - "/mnt/fast/downloads/seedbox:/downloads"
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Main router for / (with auth)
      - "traefik.http.routers.shows.entrypoints=https"
      - "traefik.http.routers.shows.rule=Host(`shows.corsair.tf`)"
      - "traefik.http.routers.shows.middlewares=security-private@file,auth@docker"
      - "traefik.http.routers.shows.service=shows"
      # API router for /api (without auth)
      - "traefik.http.routers.shows-api.entrypoints=https"
      - "traefik.http.routers.shows-api.rule=Host(`shows.corsair.tf`) && PathPrefix(`/api`)"
      - "traefik.http.routers.shows-api.middlewares=security-private@file"
      - "traefik.http.routers.shows-api.service=shows"
      - "traefik.http.routers.shows-api.priority=100"
      # Service definition
      - "traefik.http.services.shows.loadbalancer.server.port=8989"

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    cpus: 1
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - 7seas
    depends_on:
      - prowlarr
    volumes:
      - "./radarr:/config"
      - "/mnt/tank/media/movies/:/movies"
      - "/mnt/fast/downloads/seedbox:/downloads"
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Main router for / (with auth)
      - "traefik.http.routers.movies.entrypoints=https"
      - "traefik.http.routers.movies.rule=Host(`movies.corsair.tf`)"
      - "traefik.http.routers.movies.middlewares=security-private@file,auth@docker"
      - "traefik.http.routers.movies.service=movies"
      # API router for /api (without auth)
      - "traefik.http.routers.movies-api.entrypoints=https"
      - "traefik.http.routers.movies-api.rule=Host(`movies.corsair.tf`) && PathPrefix(`/api`)"
      - "traefik.http.routers.movies-api.middlewares=security-private@file"
      - "traefik.http.routers.movies-api.service=movies"
      - "traefik.http.routers.movies-api.priority=100"
      # Service definition
      - "traefik.http.services.movies.loadbalancer.server.port=7878"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
    environment:
      - PUID=3000
      - PGID=3002
      - TZ=Europe/Paris
    volumes:
      - "./seerr:/app/config"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.seerr.entrypoints=https"
      - "traefik.http.routers.seerr.rule=Host(`seerr.corsair.tf`)"
      - "traefik.http.routers.seerr.middlewares=security-soft@file"
      - "traefik.http.routers.seerr.service=seerr"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

networks:
  traefik:
    external: true
  7seas:
    external: true
